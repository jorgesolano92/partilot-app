<ion-content [fullscreen]="true" class="registro-content">
  <div class="registro-container">
    <div class="brand-section">
      <img src="/assets/logo_menu.svg" alt="PARTILOT" class="logo-image">
      <h1 class="welcome-title">Crea una cuenta</h1>
      <p class="welcome-subtitle">y únete a <strong>PARTILOT</strong></p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="input-wrap">
        <ion-icon name="mail-outline" class="input-icon"></ion-icon>
        <ion-input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Email de Acceso"
          inputmode="email"
          class="input-field"
          required>
        </ion-input>
      </div>

      <div class="input-wrap">
        <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
        <ion-input
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          name="password"
          placeholder="Contraseña"
          class="input-field"
          required>
        </ion-input>
        <button type="button" class="input-icon-right" (click)="togglePassword()" tabindex="-1" aria-label="Mostrar u ocultar contraseña">
          <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </button>
      </div>

      <div class="input-wrap input-wrap-date" [class.has-value]="!!fechaNacimiento">
        <ion-icon name="calendar-outline" class="input-icon"></ion-icon>
        <ion-input
          type="date"
          [(ngModel)]="fechaNacimiento"
          name="fechaNacimiento"
          class="input-field input-field-date"
          required>
        </ion-input>
        <span class="date-placeholder" *ngIf="!fechaNacimiento">Fecha de nacimiento</span>
      </div>

      <div class="legal-block">
        <label class="checkbox-wrap">
          <input
            type="checkbox"
            [(ngModel)]="aceptarCondiciones"
            name="aceptarCondiciones"
            class="checkbox-input"
            [disabled]="!legalConfigLoaded">
          <span class="checkbox-label">{{ registrationLabel }}</span>
        </label>
        <div class="legal-links" *ngIf="legalConfigLoaded">
          <button type="button" class="link-inline" (click)="abrirDocumento('terminos-y-condiciones')">Términos</button>
          <span class="legal-sep">·</span>
          <button type="button" class="link-inline" (click)="abrirDocumento('politica-de-privacidad')">Privacidad</button>
          <span class="legal-sep">·</span>
          <button type="button" class="link-inline" (click)="abrirDocumento('marco-legal')">Marco legal</button>
        </div>
      </div>

      <div class="loading-inline" *ngIf="loading">
        <ion-spinner name="crescent"></ion-spinner>
        <span>Creando cuenta...</span>
      </div>
      <ion-button type="submit" class="btn-registro" [disabled]="!canSubmit" expand="block">
        Registrate
      </ion-button>
    </form>

    <p class="footer-accede">
      Ya tienes cuenta? <a href="javascript:void(0)" class="link-accede" (click)="irALogin()">Accede</a>
    </p>
  </div>
</ion-content>
