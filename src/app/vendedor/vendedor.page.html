<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title></ion-title>
    <div class="header-content">
      <img src="/assets/logo_menu.svg" alt="PARTILOT" class="logo-image">
    </div>
    <ion-buttons slot="end">
      <ion-button fill="clear" routerLink="/tabs/notificaciones" title="Notificaciones">
        <ion-icon name="notifications-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-menu-button menu="main-menu" slot="end"></ion-menu-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="vendedor-content">
  <div class="vendedor-container">
    
    <!-- Selector de rol (Usuario/Vendedor/Gestor) - solo opciones permitidas -->
    <div class="rol-selector" *ngIf="authService.showRoleSelector()">
      <ion-button 
        *ngIf="authService.canCliente()"
        class="rol-button" 
        fill="clear"
        (click)="cambiarRol('usuario')">
        <ion-icon name="person-outline" slot="start"></ion-icon>
        Usuario
      </ion-button>
      <ion-button 
        *ngIf="authService.canViewVendedor()"
        class="rol-button active" 
        fill="clear"
        [disabled]="true">
        <ion-icon name="bag-outline" slot="start"></ion-icon>
        Vendedor
      </ion-button>
      <ion-button 
        *ngIf="authService.canManager()"
        class="rol-button" 
        fill="clear"
        (click)="cambiarRol('gestor')">
        <ion-icon name="people-outline" slot="start"></ion-icon>
        Gestor
      </ion-button>
    </div>

    <!-- Card de Tutorial -->
    <div class="tutorial-card figma-card-" (click)="verTutoriales()">
      <div class="tutorial-content">
        <img src="/assets/images/play.png" alt="Tutoriales" class="tutorial-image">
        <div class="tutorial-text">
          <h4 style="margin:0; font-weight: 700;" class="tutorial-title">¿PARTILOT te guia?</h4>
          <p class="block-text">Mira nuestros tutoriales y descubre <br> lo puedes hacer en <b>PARTILOT</b></p>
        </div>
      </div>
    </div>

    <!-- Cards de Acciones (dos columnas) -->
    <div class="acciones-principales">
      <div class="accion-card participaciones-card" (click)="irAParticipaciones()">
        <div class="card-content">
          <h3 class="card-title">Participaciones</h3>
          <p class="card-description">El control total del estado de tus participaciones</p>
          <div class="card-illustration">
            <img src="/assets/images/participaciones.png" alt="Participaciones" class="card-image">
          </div>
        </div>
      </div>

      <div class="accion-card escaner-card" (click)="irAEscaner()">
        <div class="card-content">
          <h3 class="card-title">Escaner</h3>
          <p class="card-description">Vende las participaciones físicas en un solo toque</p>
          <div class="card-illustration">
            <img src="/assets/images/escaner.png" alt="Escaner" class="card-image">
          </div>
        </div>
      </div>
    </div>

    <!-- Card de Venta (ancho completo) -->
    <div class="accion-card venta-card" (click)="irAVenta()">
      <div class="card-content">
        <div class="venta-card-content">
          <div class="venta-text">
            <h3 class="card-title">Venta</h3>
            <p class="card-description">Gestiona la venta de tus participaciones asignadas.</p>
          </div>
          <div class="venta-illustration">
          <img src="/assets/images/venta.png" alt="Venta" class="card-image card-image-large">
          </div>
        </div>
      </div>
    </div>

  </div>
</ion-content>
